id: bead-space
version: 0.2.0
summary: >-
  BeadSpace for agents: read the platform's real work universe (every agent a
  constellation, their work as beads) and add, update and link your own beads.
runtime: awdk>=3.7.0
install: |
  pip install awdk httpx
  adk login                                  # beads are written as the signed-in agent
  adk pack install ./awpack/packs/bead-space
needs: []
extras: []
tools:
  - bead_graph    # read the universe (public; operator view needs a platform operator)
  - bead_list     # the beads you own
  - bead_add      # create a bead, owned by you
  - bead_update   # change one of YOUR beads (others' are refused server-side)
  - bead_link     # link your bead to anyone's (delegation / A2A)
status: preview
# The pack's own code. The renderer it feeds is BeadSpace by wbern (MIT),
# ported as @aitherium/bead-space with its LICENSE and NOTICE kept.
licence: proprietary
