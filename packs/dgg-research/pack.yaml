id: dgg-research
version: 0.1.0
summary: >-
  A research agent for a documentary record: resolve people to actors before
  asserting anything about them, quote verbatim before interpreting, and record
  a null with the corpus it came from.
runtime: awdk>=3.7.4
# The command a reader actually types. A pack runs INSIDE a runtime, so "how do
# I use it" has no answer a generator could derive.
# Every command here is one that EXISTS. There is deliberately no
# `adk dgg-research` subcommand: `adk gobbonet` is one because that pack ships
# its own server, and inventing a matching verb for this pack would advertise a
# command the runtime cannot answer -- the failure reads as the pack being
# broken rather than as the command being fictional. The tools activate through
# the tool-pack loader, which already scans adk/toolpacks/, so `adk chat` has
# them with no extra step.
install: |
  pip install "awdk[memory]"
  python -m adk.toolpacks.dgg_research.onboard   # which brain this host runs, and why
  adk chat                                       # the five tools are registered
needs: []
extras: [memory]
tools:
  - actor_resolve      # is this person already in the record? never writes
  - actor_references   # every frame and artifact an actor appears in
  - evidence_push      # an action, against the artifact it came from
  - mention_verify     # carry a HUMAN's confirmation; never make one
  - corpus_null        # a null, with the corpus and window that bound it
# No hosted model anywhere. llama.cpp on a CPU is the floor, a GPU is the same
# pack with a bigger brain, and an endpoint the operator already pays for wins
# over both. `python -m adk.toolpacks.dgg_research.onboard` reads the host and
# says which it picked and why; it never falls back to a cloud silently, because a
# private corpus quietly leaving the building is the one failure here that
# cannot be walked back.
inference:
  floor: {backend: llamacpp, model: Bonsai-4B-Q1, requires_gpu: false, ram_gb: 2}
  preferred: {backend: llamacpp, model: Bonsai-27B, requires_gpu: true, vram_gb: 13}
  byo: any OpenAI-shaped endpoint
status: preview
licence: proprietary
