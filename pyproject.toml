[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awpack"
version = "0.1.0"
description = "Install and manage agent packs from the shelf"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "proprietary"}
authors = [{name = "AitherOS Contributors"}]

dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
awpack = "awpack.cli:main"

# The shelf ships INSIDE the wheel as `awpack/packs/**` (w1b-19-05): the source
# tree keeps packs/ at the project root, and package-dir maps it under the
# package so `pip install awpack && awpack list` finds the same packs a clone does.
[tool.setuptools]
packages = ["awpack", "awpack.packs"]

[tool.setuptools.package-dir]
"awpack.packs" = "packs"

[tool.setuptools.package-data]
"awpack.packs" = ["**/*"]
